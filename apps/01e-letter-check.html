<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Letter Checkpoint</title>
<style>
:root{
  --bg:#f7efdd; --card:#fffdf6; --ink:#221c14; --muted:#6b6353; --line:#221c14;
  --blue:#1d5fa9; --orange:#d46508; --green:#2c7a57; --red:#bf3b2e;
  --amber:#f7f1dc; --sh:4px 4px 0 var(--line);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(rgba(120,90,40,.05) 1px,transparent 1.3px),
    radial-gradient(rgba(255,255,255,.5) 1.4px,transparent 1.6px);
  background-size:26px 26px,34px 34px;
  font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  font-size:17px;line-height:1.45;padding:18px 14px 30px;max-width:620px;margin:0 auto}
.kr{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-weight:800}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:5px;z-index:90;pointer-events:none;
  background:repeating-linear-gradient(90deg,#a8524e 0 44px,#f3ecd9 44px 47px,#c9973f 47px 91px,
   #f3ecd9 91px 94px,#41678f 94px 138px,#f3ecd9 138px 141px,#4f7d62 141px 185px,#f3ecd9 185px 188px,
   #6f5590 188px 232px,#f3ecd9 232px 235px);opacity:.85}

.appbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.appbar a,.appbar button{font:inherit;font-weight:800;font-size:14px;text-decoration:none;
  color:var(--muted);background:transparent;border:0;box-shadow:none;padding:7px 10px;
  min-height:40px;display:inline-flex;align-items:center;gap:6px;border-radius:10px;cursor:pointer}
.appbar a:hover,.appbar button:hover{background:rgba(0,0,0,.055);color:var(--ink)}
.ab-home{border:2px solid var(--line)!important;color:var(--ink)!important;background:var(--card)!important;
  box-shadow:2px 2px 0 var(--line)!important}
.ab-home:active{transform:translate(2px,2px)!important;box-shadow:none!important}
.ab-step{background:#a63a2e;color:#fbf3e4;font-size:12px;font-weight:800;letter-spacing:.1em;
  padding:5px 9px;border-radius:7px;box-shadow:inset 0 0 0 2px rgba(251,243,228,.55);margin-left:2px}
.ab-right{margin-left:auto;display:flex;gap:2px;align-items:center}
.ab-arrow{font-size:19px;line-height:1;padding:7px 13px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}

header{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.seal{min-width:40px;height:40px;padding:0 8px;border-radius:9px;background:#a63a2e;color:#fbf3e4;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto;
  box-shadow:inset 0 0 0 2.2px rgba(251,243,228,.55)}
h1{font-size:clamp(19px,4.4vw,25px);margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;font-weight:700}

/* progress */
.bar{height:12px;border:3px solid var(--line);border-radius:99px;background:var(--card);
  margin:14px 0 4px;overflow:hidden;box-shadow:2px 2px 0 var(--line)}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .35s ease}
.barline{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:800;
  letter-spacing:.03em;margin-bottom:2px}

/* screens */
.panel{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:var(--sh);
  padding:18px;margin-top:12px}
.ask{text-align:center;font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:12px}

.prompt{display:flex;align-items:center;justify-content:center;min-height:168px;margin-bottom:4px}
.pletter{font-size:clamp(84px,22vw,124px);line-height:1}
.pimg{width:min(64vw,230px);aspect-ratio:1/1;object-fit:cover;border:3px solid var(--line);
  border-radius:18px;box-shadow:2px 2px 0 var(--line)}
.pspk{width:132px;height:132px;border-radius:50%;background:var(--orange);color:#fff;font-size:52px;
  border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
.pspk:active{transform:translate(3px,3px);box-shadow:none}
.replay{display:block;margin:2px auto 0;background:transparent;border:0;box-shadow:none;
  color:var(--muted);font-weight:800;font-size:13.5px;cursor:pointer;padding:8px;min-height:40px}

/* answer grids */
.opts{display:grid;gap:9px;margin-top:12px}
.opts.letters{grid-template-columns:repeat(4,1fr)}
.opts.pics{grid-template-columns:repeat(2,1fr)}
.opt{border:3px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;
  box-shadow:2px 2px 0 var(--line);padding:0;overflow:hidden;font:inherit;color:var(--ink)}
.opt:active{transform:translate(2px,2px);box-shadow:none}
.opts.letters .opt{min-height:76px;font-size:40px;display:flex;align-items:center;justify-content:center}
.opts.pics .opt{aspect-ratio:1/1}
.opts.pics .opt img{width:100%;height:100%;object-fit:cover;display:block}
.opt.right{background:#e6f2ea;border-color:var(--green);box-shadow:2px 2px 0 var(--green)}
.opt.wrong{background:#f9e8e5;border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.4}

/* verdict */
.verdict{margin-top:12px;border-radius:15px;padding:13px 15px;font-weight:700;font-size:15.5px;
  border:3px dashed var(--line);display:none}
.verdict.show{display:block}
.verdict.good{background:#e9f3ec}
.verdict.miss{background:#f9ece9}
.verdict b.kr{font-size:26px;vertical-align:-3px}
.verdict .why{display:block;color:var(--muted);font-weight:700;font-size:13.5px;margin-top:4px}

button.big{font:inherit;font-weight:800;cursor:pointer;border:3px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:13px;padding:13px 16px;min-height:54px;box-shadow:2px 2px 0 var(--line);
  width:100%;margin-top:11px;font-size:17px}
button.big:active{transform:translate(2px,2px);box-shadow:none}
button.big.go{background:var(--orange);color:#fff}

/* start + finish */
.choice{display:grid;gap:10px;margin-top:14px}
.ch{border:3px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--sh);
  padding:15px 17px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.ch:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.ch b{font-size:18px;font-weight:800;display:block}
.ch span{color:var(--muted);font-size:14px;font-weight:700}
.score{font-size:clamp(38px,10vw,56px);font-weight:800;text-align:center;line-height:1.1;margin:6px 0 2px}
.shaky{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.shaky .s{border:3px solid var(--red);border-radius:11px;background:#f9e8e5;min-width:48px;min-height:48px;
  display:flex;align-items:center;justify-content:center;font-size:25px}
.onward{display:block;margin-top:14px;text-align:center;background:var(--card);border:3px solid var(--line);
  border-radius:15px;padding:14px;font-weight:800;text-decoration:none;color:var(--ink);box-shadow:var(--sh)}
.onward small{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:2px}
.keys{margin-top:14px;color:var(--muted);font-size:12.5px;font-weight:700;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
<link rel="stylesheet" href="assets/_ui.css">
</head>
<body>

<nav class="appbar">
  <a class="ab-home" href="index.html">‹ All apps</a>
  <span class="ab-step">01 · CHECK</span>
  <span class="ab-right">
    <a class="ab-arrow" href="01d-vowels.html" title="Previous: The 21 Vowels" aria-label="Previous">‹</a>
    <a class="ab-arrow" href="01f-batchim.html" title="Next: The Bottom of the Block" aria-label="Next">›</a>
  </span>
</nav>

<header>
  <div class="seal" id="seal">✓</div>
  <div>
    <h1 id="h1">Letter Checkpoint</h1>
    <div class="sub" id="sub">You have met all 40. Let's find out which ones stuck.</div>
  </div>
</header>

<div id="app"></div>

<script src="assets/_articulation.js"></script>
<script src="assets/_vowels.js"></script>
<script src="assets/_confusables.js"></script>
<script src="assets/_progress.js"></script>
<script src="_pack.js"></script>
<script src="assets/_only.js"></script>
<script>
/* 학생 팩이 letters 를 적어뒀으면 그 글자만 남긴다. 없으면 전부 나온다. */
var _acAll = ARTIC, _vbAll = VOWELS_BASIC, _vcAll = VOWELS_COMPOUND;
ARTIC = ONLY(_acAll, 'consonants');
VOWELS_BASIC = ONLY(_vbAll, 'vowels');
VOWELS_COMPOUND = ONLY(_vcAll, 'vowels');
/* 자음만 배웠거나 모음만 배운 상태는 정상이다. 셋 다 비면 그때만 되돌린다. */
if (!ARTIC.length && !VOWELS_BASIC.length && !VOWELS_COMPOUND.length) {
  ARTIC = _acAll; VOWELS_BASIC = _vbAll; VOWELS_COMPOUND = _vcAll;
}

var O='assets/img/obj/', V='assets/voice/';
function g(id){ return document.getElementById(id); }

/* ---------- one flat pool, both alphabets ---------- */
function build(){
  var out=[];
  ARTIC.forEach(function(x){
    out.push({ c:x.c, sound:x.sound, obj:x.obj, kind:'consonant' });
  });
  VOWELS_BASIC.concat(VOWELS_COMPOUND).forEach(function(v){
    out.push({ c:v.c, sound:v.sound, obj:v.obj||null, kind:'vowel',
               parts:v.parts||null });
  });
  return out;
}
var POOL=build();
var BY={}; POOL.forEach(function(x){ BY[x.c]=x; });

/* ---------- audio ---------- */
var A={};
POOL.forEach(function(x){ if(!A[x.sound]){ var a=new Audio(V+x.sound+'.wav'); a.preload='auto'; A[x.sound]=a; } });
var unlocked=false;
function unlock(){ if(unlocked)return; unlocked=true;
  for(var k in A){ (function(a){ try{ var p=a.play(); if(p&&p.then) p.then(function(){a.pause();a.currentTime=0;}).catch(function(){}); }catch(e){} })(A[k]); } }
function play(id){ if(!id)return; var a=A[id]; if(!a)return;
  for(var k in A) try{ A[k].pause(); A[k].currentTime=0; }catch(e){}
  try{ a.currentTime=0; var p=a.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){}
}

/* ---------- helpers ---------- */
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
/* Pull distractors from the confusable maps FIRST, so a ㄱ question is
   answered against ㅋ·ㄲ·ㄴ and not against ㅠ. Only if those run out do we
   fall back to the rest of the pool. */
function distractors(item, n, mode, mustHaveObj){
  var wantEar = (mode==='ear');
  var first  = (wantEar?CONFUSE_EAR:CONFUSE_SHAPE)[item.c]||[];
  var second = (wantEar?CONFUSE_SHAPE:CONFUSE_EAR)[item.c]||[];
  var picked=[], seen={}; seen[item.c]=1;
  function take(list){
    shuffle(list).forEach(function(c){
      if(picked.length>=n) return;
      if(seen[c]) return;
      var it=BY[c]; if(!it) return;
      if(item.kind==='consonant' && it.kind!=='consonant') return;   /* don't mix alphabets */
      if(item.kind==='vowel'     && it.kind!=='vowel')     return;
      if(mustHaveObj && !it.obj) return;
      seen[c]=1; picked.push(it);
    });
  }
  take(first); take(second);
  if(picked.length<n){
    take(POOL.filter(function(x){ return x.kind===item.kind; }).map(function(x){ return x.c; }));
  }
  return picked.slice(0,n);
}

/* ---------- session state ---------- */
var queue=[], cleared=0, total=0, missed={}, asked=0, current=null, locked=false, lastDir={};

function start(scope){
  var items;
  if(scope==='shaky'){
    /* 지난 점검에서 틀렸던 글자만. 기록은 _progress.js 가 남긴다 */
    var wob=(window.Progress&&Progress.shaky)?Progress.shaky('01e'):[];
    items = POOL.filter(function(x){ return wob.indexOf(x.c)>=0; });
    if(!items.length){ home(); return; }
  } else {
    items = POOL.filter(function(x){
      return scope==='all' ? true : x.kind===scope;
    });
  }
  queue=shuffle(items); total=items.length; cleared=0; asked=0; missed={}; lastDir={};
  nextQuestion();
}

/* which of the three directions can this item be asked in? */
function dirsFor(item){
  var d=['hear'];                              /* 🔊 → letter, always possible */
  if(item.obj){ d.push('see'); d.push('name'); } /* 🖼 → letter, and letter → 🖼 */
  return d;
}

function nextQuestion(){
  if(!queue.length){ finish(); return; }
  var item=queue[0];
  var opts=dirsFor(item);
  /* rotate direction so the same letter is not asked the same way twice running */
  var avail=opts.filter(function(d){ return d!==lastDir[item.c]; });
  var dir=(avail.length?avail:opts)[Math.floor(Math.random()*(avail.length?avail.length:opts.length))];
  lastDir[item.c]=dir;
  current={ item:item, dir:dir };
  asked++;
  render();
}

function answer(chosenIdx, correctIdx, btns){
  if(locked) return; locked=true;
  var item=current.item, right=(chosenIdx===correctIdx);
  btns.forEach(function(b,i){
    b.disabled=true;
    if(i===correctIdx) b.className=b.className.replace(' dim','')+' right';
    else if(i===chosenIdx) b.className+=' wrong';
    else b.className+=' dim';
  });
  play(item.sound);

  var v=g('verdict');
  v.className='verdict show '+(right?'good':'miss');
  v.innerHTML = right
    ? 'Yes. <b class="kr">'+item.c+'</b>'
    : 'This one is <b class="kr">'+item.c+'</b>.<span class="why">'+whyMissed(item)+'</span>';

  if(right){
    queue.shift();
    cleared++;
    setTimeout(function(){ locked=false; nextQuestion(); }, 950);
  } else {
    missed[item.c]=(missed[item.c]||0)+1;
    /* back into the queue, a few places later: it must be answered right to clear */
    var it=queue.shift();
    queue.splice(Math.min(3,queue.length), 0, it);
    var b=g('cont'); b.style.display='block';
    b.onclick=function(){ locked=false; nextQuestion(); };
    b.focus();
  }
  paint();
}

/* a one-line reason, drawn from what actually makes this letter confusable */
function whyMissed(item){
  var ear=(CONFUSE_EAR[item.c]||[]).slice(0,2).join(' · ');
  var shape=(CONFUSE_SHAPE[item.c]||[]).slice(0,2).join(' · ');
  if(current.dir==='hear' && ear)  return 'Easy to mishear against '+ear+'. Listen for it again below.';
  if(shape) return 'Easy to mix up with '+shape+' on the page.';
  return 'Take one more look at the shape.';
}

function paint(){
  var pct = total ? Math.round(cleared/total*100) : 0;
  var f=g('fill'); if(f) f.style.width=pct+'%';
  var c=g('count'); if(c) c.textContent=cleared+' / '+total+' letters cleared';
}

/* ---------- rendering ---------- */
function render(){
  var item=current.item, dir=current.dir;
  var app=g('app');
  var askText = dir==='hear' ? 'Which letter is this sound?'
              : dir==='see'  ? 'Which letter does this picture stand for?'
                             : 'Which picture goes with this letter?';

  var promptHtml, optsClass, choices, correctIdx;

  if(dir==='name'){
    /* letter shown, pick the picture */
    choices = shuffle([item].concat(distractors(item,3,'shape',true)));
    promptHtml = '<div class="prompt"><div class="pletter kr">'+item.c+'</div></div>';
    optsClass='pics';
  } else if(dir==='see'){
    /* picture shown, pick the letter */
    choices = shuffle([item].concat(distractors(item,3,'shape',false)));
    promptHtml = '<div class="prompt"><img class="pimg" src="'+O+item.obj+'.webp" alt="Mnemonic picture for a Korean letter"></div>';
    optsClass='letters';
  } else {
    /* sound played, pick the letter */
    choices = shuffle([item].concat(distractors(item,3,'ear',false)));
    promptHtml = '<div class="prompt"><button class="pspk" id="spk" aria-label="Play the sound again">🔊</button></div>'+
                 '<button class="replay" id="replay">Play it again</button>';
    optsClass='letters';
  }
  correctIdx = choices.indexOf(item);

  app.innerHTML =
    '<div class="barline"><span id="count"></span><span>'+(dir==='hear'?'listening':'reading')+'</span></div>'+
    '<div class="bar"><i id="fill"></i></div>'+
    '<div class="panel">'+
      '<div class="ask">'+askText+'</div>'+
      promptHtml+
      '<div class="opts '+optsClass+'" id="opts"></div>'+
      '<div class="verdict" id="verdict"></div>'+
      '<button class="big go" id="cont" style="display:none">Next →</button>'+
    '</div>'+
    '<div class="keys"><b>1</b>–<b>4</b> picks · <b>Space</b> replays · <b>Enter</b> continues</div>';

  var wrap=g('opts'), btns=[];
  choices.forEach(function(ch,i){
    var b=document.createElement('button');
    b.className='opt';
    if(optsClass==='pics'){
      b.innerHTML='<img src="'+O+ch.obj+'.webp" alt="">';
      b.setAttribute('aria-label','Picture option '+(i+1));
    } else {
      b.className+=' kr'; b.textContent=ch.c;
    }
    b.onclick=function(){ unlock(); answer(i, correctIdx, btns); };
    btns.push(b); wrap.appendChild(b);
  });

  if(dir==='hear'){
    g('spk').onclick=function(){ unlock(); play(item.sound); };
    g('replay').onclick=function(){ unlock(); play(item.sound); };
    setTimeout(function(){ play(item.sound); }, 320);
  }
  locked=false;
  paint();
}

function finish(){
  var shaky=Object.keys(missed).sort(function(a,b){ return missed[b]-missed[a]; });
  var perfect = shaky.length===0;
  /* 판 결과를 남긴다. 완벽한 판은 흔들린 기록을 지워서 복습 단추도 사라진다. */
  if(window.Progress) Progress.done('01e', shaky);
  g('seal').textContent='✓';
  g('h1').textContent = perfect ? 'All clear.' : 'Checkpoint done.';
  g('sub').textContent = perfect
    ? 'Every letter, first try. You are ready to build syllables.'
    : 'Every letter cleared in the end: these are the ones to watch.';

  g('app').innerHTML =
    '<div class="panel">'+
      '<div class="score">'+total+' / '+total+'</div>'+
      '<div class="ask" style="margin-bottom:0">letters cleared in '+asked+' questions</div>'+
      (perfect ? '' :
        '<div style="margin-top:16px;font-weight:800;font-size:15px">Took more than one try:</div>'+
        '<div class="shaky">'+shaky.map(function(c){
            return '<div class="s kr" title="missed '+missed[c]+'×">'+c+'</div>'; }).join('')+
        '</div>'+
        '<div class="sub" style="margin-top:8px">Worth one more pass through the letters before you move on.</div>')+
      '<button class="big" id="again">↻ Run the checkpoint again</button>'+
    '</div>'+
    '<a class="onward" href="01f-batchim.html">Next → The bottom of the block'+
      '<small>One more thing before you build: 받침. 27 spellings, 7 sounds</small></a>'+
    '<a class="onward" href="01d-vowels.html" style="background:var(--amber)">‹ Back to the letters'+
      '<small>Look at the shapes again before moving on</small></a>';
  g('again').onclick=function(){ home(); };
}

function shakyBtn(){
  var wob=(window.Progress&&Progress.shaky)?Progress.shaky('01e'):[];
  if(!wob.length) return '';
  return '<button class="ch" data-s="shaky" style="background:var(--blush)">'+
    '<b>↻ The wobbly ones · '+wob.length+'</b>'+
    '<span>Missed last time: <span class="kr">'+wob.join(' ')+'</span>. Clear these first.</span></button>';
}
/* 설명에도 실제로 배운 글자만 적는다. 안 배운 걸 나열하면 학생이 겁먹는다. */
function letterList(scope){
  var xs = POOL.filter(function(x){ return scope==='all' ? true : x.kind===scope; });
  return xs.map(function(x){ return x.c; }).join(' ');
}
function countFor(scope){
  return POOL.filter(function(x){ return scope==='all' ? true : x.kind===scope; }).length;
}
function home(){
  g('seal').textContent='✓';
  g('h1').textContent='Letter Checkpoint';
  g('sub').textContent="You have met all 40. Let's find out which ones stuck.";
  g('app').innerHTML=
    '<div class="panel" style="padding:16px 18px">'+
      '<div style="font-weight:700;font-size:15.5px">Nothing new here: every letter below already appeared in the '+
      'story, the sound lab, the chant or the vowel screen. This just asks for them back.'+
      '<span class="sub" style="display:block;margin-top:6px">Get one wrong and it comes round again later. '+
      'The run ends when every letter has been answered right.</span></div>'+
    '</div>'+
    '<div class="choice">'+
      shakyBtn()+
      '<button class="ch" data-s="consonant"><b>Consonants</b><span>ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ ㅇ ㅈ ㅊ ㅋ ㅌ ㅍ ㅎ and the five tense ones</span></button>'+
      '<button class="ch" data-s="vowel"><b>Vowels</b><span>ㅏ ㅑ ㅓ ㅕ ㅗ ㅛ ㅜ ㅠ ㅡ ㅣ and the eleven built from them</span></button>'+
      '<button class="ch" data-s="all"><b>Everything</b><span>The whole alphabet, shuffled together</span></button>'+
    '</div>'+
    '<div class="keys">Tap an answer. <b>1</b>–<b>4</b> also picks · <b>Space</b> replays the sound · <b>Enter</b> continues</div>';
  [].forEach.call(document.querySelectorAll('.ch'),function(b){
    var nb=b.querySelector('b'), sp=b.querySelector('span');
    if(nb) nb.textContent = nb.textContent + ' \u00b7 ' + countFor(b.dataset.s);
    if(sp) sp.textContent = letterList(b.dataset.s);
    b.onclick=function(){ unlock(); start(b.dataset.s); };
  });
}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){ var c=g('cont'); if(c && c.style.display!=='none'){ e.preventDefault(); c.click(); return; } }
  if(e.key===' '){ if(current && current.dir==='hear'){ e.preventDefault(); unlock(); play(current.item.sound); } return; }
  if(/^[1-4]$/.test(e.key)){
    var opts=document.querySelectorAll('#opts .opt');
    var i=parseInt(e.key,10)-1;
    if(opts[i] && !opts[i].disabled){ e.preventDefault(); opts[i].click(); }
  }
});

home();
</script>


<script>
Progress.visit('01e');
/* 다음 화면으로 넘어가는 큰 링크를 누르면 그 화면을 끝낸 것으로 본다 */
document.addEventListener('click',function(e){
  var t=e.target; while(t&&t!==document){ if(t.classList&&t.classList.contains('onward')){ Progress.done('01e'); break; } t=t.parentNode; }
},true);
</script>
