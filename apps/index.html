<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Korean</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-size:17px;padding:26px 16px 44px;max-width:1080px;margin:0 auto}
h1{font-size:clamp(26px,5.6vw,40px);margin:0;letter-spacing:-.02em;display:flex;align-items:center}
.hseal{display:inline-flex;align-items:center;justify-content:center;width:1.35em;height:1.35em;
  margin-right:.38em;border-radius:.22em;background:var(--seal);color:var(--seal-ink);font-size:.72em;
  box-shadow:inset 0 0 0 .09em var(--seal-rim);flex:0 0 auto}
.sub{color:var(--muted);font-size:16px;margin-top:6px;font-weight:600}
.lvl{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:3px 13px;
  font-size:13px;font-weight:800;margin-top:12px}

/* ── 구간 제목 ─────────────────────────────────────────── */
.secthead{display:flex;align-items:baseline;gap:10px;margin:30px 0 10px;flex-wrap:wrap}
.secthead b{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.secthead i{font-style:normal;color:var(--muted);font-size:13.5px;font-weight:600}

/* ── 알파벳 트랙: 화면 여섯 개가 한 줄로 이어진다 ──────── */
.track{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
a.step{background:var(--card);border:3px solid var(--line);border-radius:15px;box-shadow:var(--sh1);
  padding:11px 12px;text-decoration:none;color:var(--ink);display:block;position:relative;
  transition:transform .07s,box-shadow .07s}
a.step:active{transform:translate(2px,2px);box-shadow:none}
a.step .n{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--muted)}
a.step .t{font-size:15.5px;font-weight:800;line-height:1.2;margin-top:2px}
a.step .g{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.3}
a.step.seen{background:var(--paper2)}
a.step.fin{background:var(--mint);border-color:var(--green)}
a.step .tick{position:absolute;right:9px;top:8px;width:20px;height:20px;border-radius:99px;
  background:var(--green);color:#fff;font-size:12px;font-weight:800;display:none;
  align-items:center;justify-content:center}
a.step.fin .tick{display:flex}

/* ── 나머지 앱 ─────────────────────────────────────────── */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
a.app{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:var(--sh);
  padding:16px;text-decoration:none;color:var(--ink);display:flex;gap:14px;align-items:flex-start;
  transition:transform .07s,box-shadow .07s;position:relative}
a.app::after{content:"";position:absolute;inset:6px;border:2px dashed rgba(34,28,20,.15);
  border-radius:13px;pointer-events:none}
a.app:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
a.app.p0{background:var(--amber)} a.app.p1{background:var(--sky)} a.app.p2{background:var(--blush)}
a.app.p3{background:var(--mint)} a.app.p4{background:#ece4f5}
a.app.seen{box-shadow:2px 2px 0 var(--line)}
a.app .seal{flex:0 0 auto;width:46px;height:46px;min-width:46px;border-radius:10px;font-size:16px;
  letter-spacing:.05em;box-shadow:inset 0 0 0 2.5px var(--seal-rim)}
a.app .t{font-size:19px;font-weight:800;line-height:1.2}
a.app .g{color:var(--muted);font-size:14.5px;font-weight:600;margin-top:4px}

/* ── 진도 한 줄 ────────────────────────────────────────── */
.pbar{display:flex;align-items:center;gap:11px;margin-top:22px;background:var(--card);
  border:3px solid var(--line);border-radius:15px;box-shadow:var(--sh1);padding:11px 14px;
  flex-wrap:wrap}
.pbar .track2{flex:1 1 180px;height:11px;border:2px solid var(--line);border-radius:99px;
  background:var(--bg);overflow:hidden;min-width:120px}
.pbar .track2 i{display:block;height:100%;background:var(--green);width:0;transition:width .4s ease}
.pbar .lab{font-size:13.5px;font-weight:800}
.pbar button{font-size:13px;min-height:38px;padding:7px 12px;border-width:2px;box-shadow:none;
  border-radius:9px;color:var(--muted)}
.pbar .off{color:var(--muted);font-size:12.5px;font-weight:700}
.onward{display:block;text-align:center;background:var(--card);border:3px solid var(--line);border-radius:15px;padding:14px;font-weight:800;text-decoration:none;color:var(--ink);box-shadow:var(--sh)}
.onward small{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:2px}
</style>
<link rel="stylesheet" href="assets/_ui.css">
</head>
<body>

<h1 id="title"><span class="hseal kr">한</span><span id="tname">Korean</span></h1>
<div class="sub" id="tsub">Sixteen screens, in order. Start at the top and keep going.</div>
<div id="tlvl"></div>

<div class="pbar" id="pbar" style="display:none">
  <span class="lab" id="plab"></span>
  <span class="track2"><i id="pfill"></i></span>
  <button id="preset" title="Clear the marks on this device">Clear marks</button>
</div>

<a class="onward" id="resume" style="display:none;margin-top:18px"></a>

<div class="secthead"><b>START HERE</b><i>The alphabet, in one run. About 40 minutes.</i></div>
<div class="track" id="track"></div>

<div class="secthead"><b>THEN THESE</b><i>Once the letters are solid. Any order your lesson needs.</i></div>
<div class="grid" id="apps"></div>

<script src="_pack.js"></script>
<script src="assets/_progress.js"></script>
<script>
/* 알파벳 트랙: 순서대로 이어지는 여섯 화면.
   이전에는 00 과 01 만 런처에 있어서 01b~01e 는 런처에서 갈 수가 없었다. */
var TRACK=[
 {id:'00',  file:'00-hangul-birth.html',      n:'00',      t:'The Birth of Hangul', g:'Why the letters look the way they do'},
 {id:'01',  file:'01-hangul-letter-lab.html', n:'01',      t:"Amin's Very Long Day", g:'A story that teaches 14 consonants'},
 {id:'01b', file:'01b-consonant-sounds.html', n:'01 · B',  t:'How the Sound Is Made', g:'Where each one happens in your mouth'},
 {id:'01c', file:'01c-tense-chant.html',      n:'01 · C',  t:'The Tense Chant', g:'ㅃㄸㅆㅉㄲ in one phrase'},
 {id:'01d', file:'01d-vowels.html',           n:'01 · D',  t:'The 21 Vowels', g:'12 basic, 9 built from them'},
 {id:'01e', file:'01e-letter-check.html',     n:'01 · E',  t:'Letter Checkpoint', g:'Prove all 40 stuck'},
 {id:'01f', file:'01f-batchim.html',           n:'01 · F',  t:'The Bottom of the Block', g:'27 spellings down there, only 7 sounds'}
];

var APPS=[
 {id:'02', n:'02', file:'02-syllable-builder.html', t:'Syllable Builder',
  g:'Build a block from consonant + vowel + final, or take a real one apart.'},
 {id:'03', n:'03', file:'03-read-it-loanwords.html', t:'Read It!',
  g:'Sound out words you already know. Your first real reading.'},
 {id:'04', n:'04', file:'04-listen-and-choose.html', t:'Listen & Choose',
  g:'Hear one word, pick which one it was.'},
 {id:'05', n:'05', file:'05-picture-match.html', t:'Picture Match',
  g:'Match each picture to its Korean word.'},
 {id:'06', n:'06', file:'06-number-machine.html', t:'Number Machine',
  g:'Prices, times, ages and counting. Both number systems.'},
 {id:'07', n:'07', file:'07-survival-korean.html', t:'Conversations',
  g:'Real scenes with both speakers. Take a role and say your lines.'},
 {id:'08', n:'08', file:'08-sentence-builder.html', t:'Sentence Builder',
  g:'Tap the blocks into the right order. The verb goes last.'},
 {id:'09', n:'09', file:'09-particle-picker.html', t:'Particle Picker',
  g:'은/는, 이/가, 을/를, 에 vs 에서. Fill the blank.'},
 {id:'10', n:'10', file:'10-verb-form-trainer.html', t:'Verb Trainer',
  g:'Dictionary form into the polite form you actually speak.'}
];

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function g(id){return document.getElementById(id);}

/* 구운 학생판이면 표지에 그 학생 이름이 뜬다 */
var P=(window.STUDENT_PACK&&typeof window.STUDENT_PACK==='object')?window.STUDENT_PACK:null;
if(P&&P.student){
  document.title=P.student+' · Korean';
  g('tname').textContent=P.student+'’s Korean';
  g('tsub').textContent=P.focus||'Made for you. Start at the top.';
  if(P.level) g('tlvl').innerHTML='<span class="lvl">'+esc(P.level)+'</span>';
}

var pr=(window.Progress&&window.Progress.get)?window.Progress:null;
var state=pr?pr.get():{visited:{},done:{}};

var tr=g('track');
TRACK.forEach(function(s){
  var a=document.createElement('a');
  var fin=!!state.done[s.id], seen=!!state.visited[s.id];
  a.className='step'+(fin?' fin':(seen?' seen':''));
  a.href=s.file;
  a.innerHTML='<span class="tick">✓</span><div class="n">'+esc(s.n)+'</div>'+
    '<div class="t">'+esc(s.t)+'</div><div class="g">'+esc(s.g)+'</div>';
  tr.appendChild(a);
});

var grid=g('apps');
APPS.forEach(function(x,i){
  var a=document.createElement('a');
  a.className='app p'+(i%5)+(state.visited[x.id]?' seen':'');
  a.href=x.file;
  a.innerHTML='<div class="seal">'+esc(x.n)+'</div><div>'+
    '<div class="t">'+esc(x.t)+'</div><div class="g">'+esc(x.g)+'</div></div>';
  grid.appendChild(a);
});

/* 진도 줄은 실제로 기록이 남는 기기에서만 보여준다.
   file:// 에서 localStorage 가 막히면 조용히 숨긴다. 빈 막대를 보여주면
   "왜 진도가 안 쌓이지" 하고 학생이 헷갈린다. */
if(pr && pr.available){
  /* 이어서 하기: 트랙에서 아직 안 끝난 첫 화면으로 */
  var nx=TRACK.find(function(s){ return !state.done[s.id]; });
  if(nx && Object.keys(state.visited).length){
    var r=g('resume');
    r.style.display='block'; r.href=nx.file;
    r.innerHTML='▶ Continue: '+esc(nx.t)+'<small>Pick up where you left off ('+esc(nx.n)+')</small>';
  }

  var all=TRACK.concat(APPS), seen=0;
  all.forEach(function(x){ if(state.visited[x.id]) seen++; });
  if(seen>0){
    g('pbar').style.display='flex';
    g('plab').textContent=seen+' of '+all.length+' opened';
    g('pfill').style.width=Math.round(seen/all.length*100)+'%';
    g('preset').onclick=function(){ pr.reset(); location.reload(); };
  }
}
</script>
</body>
</html>
