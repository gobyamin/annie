<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Korean</title>
<link rel="stylesheet" href="apps/assets/_ui.css">
<style>
body{max-width:520px;margin:0 auto;padding:60px 20px;text-align:center;font-size:17px}
h1{font-size:34px;margin:0 0 10px;letter-spacing:-.02em}
.hseal{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;
  margin-right:.3em;border-radius:.22em;background:var(--seal);color:var(--seal-ink);font-size:.72em;
  box-shadow:inset 0 0 0 .09em var(--seal-rim);vertical-align:-.12em}
p{color:var(--muted);font-weight:600;margin:0 0 26px}
a.go{display:inline-block;background:var(--card);border:3px solid var(--line);border-radius:15px;
  box-shadow:var(--sh);padding:16px 26px;font-weight:800;text-decoration:none;color:var(--ink);font-size:18px}
a.go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;margin-top:30px;line-height:1.6}
</style>
</head>
<body>
<!-- 뿌리 페이지에는 학생 이름을 두지 않는다. 학생 선반은 /s/<이름>/ 으로 직접 간다.
     공개 저장소라 이 페이지는 누구나 본다. -->
<h1><span class="hseal kr">한</span>Korean</h1>
<p>Practice apps for absolute beginners.</p>
<a class="go" href="apps/index.html">Open the apps →</a>
<small>If your teacher gave you a personal link, use that one instead.<br>It has your own lessons in it.</small>
</body>
</html>
